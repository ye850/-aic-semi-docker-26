name: Build AIC Semi Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/aic-ntl-semi:latest
          docker build -t $IMG .
          echo "IMG=$IMG" >> $GITHUB_ENV
          docker images

      - name: Push to GHCR
        run: docker push $IMG

      - name: Export tar and split (for direct download)
        run: |
          docker save $IMG -o image.tar
          ls -lh image.tar
          split -b 480M image.tar image.tar.part.
          ls -lh image.tar.part.* | head

      - name: Upload split parts
        uses: actions/upload-artifact@v4
        with:
          name: aic-ntl-semi-image-tar-parts
          path: image.tar.part.*
          retention-days: 14
